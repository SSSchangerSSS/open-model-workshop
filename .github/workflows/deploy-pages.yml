name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the round-2 work was verified with
          # (bun.lock frozen) — do not bump casually.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality gates (lint + typecheck + tests)
        run: |
          bun run lint
          bun run typecheck
          bun run test

      - name: Build static site (SSG prerender)
        env:
          # Must match the repository name so assets resolve under github.io/<repo>/
          PAGES_BASE_PATH: /open-model-workshop/
        run: bun run build

      - name: Publish the real prerendered 404 page
        run: |
          # The /404 route is prerendered by the SSG build (vite.config.ts
          # prerender.pages). It is a genuine Persian error page with
          # noindex — NOT a copy of index.html, so broken links no longer
          # serve the home body + home canonical.
          test -f .output/public/404/index.html || { echo "::error::404 was not prerendered"; exit 1; }
          cp .output/public/404/index.html .output/public/404.html

      - name: Post-build checks (routes, 404, metadata, transfer budget)
        run: node scripts/check-output.mjs .output/public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
